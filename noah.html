        .title .cyan{color:var(--cyan)}
        .hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

        .status-go.off{background:transparent;color:var(--dim)}

        main.main{position:relative;overflow:hidden;background:#000308;display:flex;flex-direction:column;min-height:600px}

        button:hover{border-color:var(--cyan);color:var(--cyan)} button.on{background:var(--lime);color:#000;border-color:var(--lime);box-shadow:0 0 12px var(--lime)} button.on-pink{background:var(--pink);color:#000;border-color:var(--pink)}
