import { axiom1, axiom3, axiom9 } from './3.axiom.en.js';
import { kern9 } from './9.kern.en.js';
import { orbit27 } from './27.orbit.en.js';
export const codec = {
  version: '9.3.27',
  // 3 Axiome bestimmen Form
  form: (input) => {
    // 1 zu 3, 3 zu 9, Auftrieb )(
    const a1 = axiom1(input); // 1 = Ursprung
    const a3 = axiom3(a1);     // 3 = Dreifaltigkeit
    const a9 = axiom9(a3);     // 9 = Vollendung
    return a9;
  },
  // 9 Kern bestimmt Raum
  space: (form) => {
    // 9 ist Raum, 9 immer 9, 360°, 9 Ecken, Ozon 299.7 DU
    return kern9.encode(form, { corners: 9, degrees: 360, du: 299.7 });
  },
  // 27 Orbit bestimmt Bahn
  orbit: (space) => {
    // 27 = 3³ = 9*3, Orbit = Umlaufbahn
    // 27 = 9 Ecken * 3 Phasen (umwerfend belebend umwerfend)
    return orbit27.orbit(space, { phases: ['umwerfend','belebend','umwerfend'] });
  },
  // Vollständiger Codec
  encode: (stick) => {
    const f = codec.form(stick);
    const s = codec.space(f);
    const o = codec.orbit(s);
    // schall hall rehall 9 99 999
    return codec.render(o);
  },
  render: (data) => {
    // MANGA ANIME COMICS RAUCH NEBEL MÄRCHEN
    return { manga: data, anime: data, comic: data, märchen: data, nebel: true };
  }
};
