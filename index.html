        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');
        :root{
          --bg:#020202;
          --panel:#0a0a0a;
          --panel2:#101010;
          --line:#1e1e1e;
          --line2:#2a2a2a;
          --gold:#ffd700;
          --gold2:#ffed8a;
          --white:#fafafa;
          --muted:#6b6b6b;
          --dim:#3a3a3a;
        }
        *{box-sizing:border-box}
        html,body{margin:0;background:var(--bg);color:var(--white)}
        .app-shell{
          min-height:100vh;
          background: var(--bg);
          color: var(--white);
          font-family:"JetBrains Mono", monospace;
          padding-top: var(--safe-area-inset-top);
          overflow-x: clip;
        }
        .gold{color:var(--gold)}
        .center{text-align:center}
        /* header */
        .hero{
          padding: 28px 16px 8px;
          border-bottom:1px solid var(--line);
          text-align:center;
        }
        .hero h1{
          font-size: clamp(18px, 5vw, 42px);
          font-weight:700;
          letter-spacing: 0.14em;
          line-height:0.95;
          margin:0;
          color:var(--gold);
          text-transform:uppercase;
        }
        .hero h1 span{
          display:block;
          font-size: clamp(11px, 2.5vw, 16px);
          letter-spacing:0.42em;
          margin-top:10px;
          color:var(--white);
          opacity:0.9;
        }
        .hero .sub{
          margin-top:14px;
          font-size:10px;
          letter-spacing:0.32em;
          color:var(--muted);
          text-transform:uppercase;
        }
        /* stage */
        .stage-wrap{
          position:relative;
          width:100%;
          max-width:1180px;
          margin:0 auto;
          padding: 18px 12px 0;
        }
        .stage{
          position:relative;
          width:100%;
          height: min(66vh, 640px);
          min-height:420px;
          background:
            radial-gradient(600px 400px at 50% 45%, rgba(255,215,0,0.06), transparent 60%),
            radial-gradient(900px 600px at 50% 50%, #0a0a0a 0%, #020202 68%);
          border:1px solid var(--line);
          overflow:hidden;
        }
        .absolute-point{
          position:absolute;
          left:50%; top:50%;
          transform: translate(-50%,-50%);
          z-index:20;
        }
        .absolute-core{
          width: 6px;
          height: 6px;
          background: var(--white);
          border-radius: 50%;
          box-shadow: 
            0 0 0 1px rgba(255,255,255,0.9),
            0 0 18px 2px rgba(255,215,0,0.9),
            0 0 60px 12px rgba(255,215,0,0.25);
          transition: all 0.6s ease;
        }
        .absolute-halo{
          position:absolute;
          left:50%; top:50%;
          transform: translate(-50%,-50%);
          border-radius:50%;
          border:1px solid rgba(255,215,0,0.18);
          pointer-events:none;
        }
        .orbit{
          position:absolute;
          left:50%; top:50%;
          transform: translate(-50%,-50%);
          border-radius:50%;
          pointer-events:none;
          border:1px dashed rgba(255,215,0,0.08);
        }
        .dot{
          position:absolute;
          width:4px; height:4px;
          background: var(--gold);
          border-radius:50%;
          transform: translate(-50%,-50%);
          box-shadow: 0 0 6px rgba(255,215,0,0.6);
          opacity:0.8;
        }
        .dot.dim{ background:var(--dim); box-shadow:none; opacity:0.45; width:3px; height:3px; }
        .dot.axiom{ background: var(--white); width:5px; height:5px; box-shadow: 0 0 8px #fff; }
        .label-abs{
          position:absolute;
          left:50%; top:50%;
          transform: translate(-50%,-50%);
          z-index:30;
          pointer-events:none;
          text-align:center;
        }
        .reise-fertig{
          font-size: clamp(28px, 8vw, 78px);
          font-weight:700;
          letter-spacing:0.18em;
          color:var(--gold);
          text-shadow: 0 0 30px rgba(255,215,0,0.6);
          opacity:0;
          transform: translateY(10px) scale(0.98);
          transition: all 0.9s cubic-bezier(.16,1,.3,1);
        }
        .reise-fertig.show{
          opacity:1;
          transform: translateY(0) scale(1);
        }
        /* controls */
        .controls{
          max-width:1180px;
          margin:0 auto;
          padding: 18px 12px;
          display:grid;
          grid-template-columns: 1fr auto;
          gap:14px;
          align-items:end;
          border-left:1px solid var(--line);
          border-right:1px solid var(--line);
          border-bottom:1px solid var(--line);
          background: linear-gradient(180deg, #0a0a0a, #070707);
        }
        @media(max-width:720px){ .controls{grid-template-columns:1fr} }
        .slider-box label{
          display:block;
          font-size:10px;
          letter-spacing:0.22em;
          color:var(--muted);
          margin-bottom:8px;
          text-transform:uppercase;
        }
        .slider-row{
          display:flex;
          align-items:center;
          gap:12px;
        }
        input[type="range"]{
          -webkit-appearance:none;
          width:100%;
          height:2px;
          background: var(--line2);
          outline:none;
        }
        input[type="range"]::-webkit-slider-thumb{
          -webkit-appearance:none;
          width:18px; height:18px;
          border-radius:50%;
          background: var(--gold);
          border:2px solid #000;
          box-shadow: 0 0 0 1px var(--gold), 0 0 12px rgba(255,215,0,0.5);
          cursor:pointer;
        }
        .f-value{
          min-width:84px;
          font-size:13px;
          color:var(--gold2);
          border:1px solid var(--line2);
          padding:6px 10px;
          text-align:center;
        }
        .btn-absolute{
          height:44px;
          padding:0 22px;
          background: var(--gold);
          color:#000;
          border:0;
          font-family:"JetBrains Mono", monospace;
          font-weight:700;
          letter-spacing:0.18em;
          font-size:12px;
          cursor:pointer;
          transition: all 0.2s;
        }
        .btn-absolute:hover{
          background: var(--gold2);
          box-shadow: 0 0 24px rgba(255,215,0,0.4);
          transform: translateY(-1px);
        }
        /* metrics */
        .metrics{
          max-width:1180px;
          margin:0 auto;
          display:grid;
          grid-template-columns: 1fr 1fr;
          border-left:1px solid var(--line);
          border-right:1px solid var(--line);
        }
        @media(max-width:860px){ .metrics{grid-template-columns:1fr} }
        .metric-col{
          padding:18px 16px;
          border-bottom:1px solid var(--line);
          border-right:1px solid var(--line);
        }
        .metric-col:last-child{border-right:0}
        .metric-title{
          font-size:10px;
          letter-spacing:0.24em;
          color:var(--muted);
          text-transform:uppercase;
          margin-bottom:12px;
        }
        .metric-row{
          display:flex;
          justify-content:space-between;
          gap:12px;
          font-size:12px;
          line-height:1.9;
          border-bottom:1px dashed #141414;
        }
        .metric-row span:first-child{color:#8a8a8a}
        .metric-row b{color:var(--white); font-weight:500}
        .metric-row b.gold{color:var(--gold)}
        .metric-row.converged b{color:var(--gold); text-shadow:0 0 8px rgba(255,215,0,0.3)}
        /* code */
        .code-wrap{
          max-width:1180px;
          margin:0 auto;
          border-left:1px solid var(--line);
          border-right:1px solid var(--line);
          border-bottom:1px solid var(--line);
          padding:16px;
          background:#060606;
        }
        .code{
          font-size:12px;
          background:#0a0a0a;
          border:1px solid var(--line2);
          padding:14px;
          overflow:auto;
          color:#d8d8d8;
        }
        .code .comment{color:var(--muted)}
        .code .kw{color:var(--gold)}
        /* journey */
        .journey{
          max-width:1180px;
          margin:0 auto;
          border-left:1px solid var(--line);
          border-right:1px solid var(--line);
          border-bottom:1px solid var(--line);
          padding:20px 16px 26px;
        }
        .journey-line{
          display:flex;
          flex-wrap:wrap;
          gap:6px;
          font-size:11px;
          line-height:1.8;
        }
        .journey-line span{
          border:1px solid var(--line2);
          padding:2px 8px;
          background:#0a0a0a;
        }
        .journey-line span.abs{
          background: var(--gold);
          color:#000;
          border-color:var(--gold);
          font-weight:700;
        }
        .final-log{
          margin-top:18px;
          padding:14px;
          border:1px solid rgba(255,215,0,0.18);
          background: linear-gradient(180deg, rgba(255,215,0,0.06), rgba(0,0,0,0));
          font-size:11px;
          line-height:1.8;
          color:#bdbdbd;
        }
