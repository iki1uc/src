        *{margin:0;padding:0;box-sizing:border-box}

        .leben-container{max-width:1400px;width:100%;background:rgba(10,14,20,0.42);border:1px solid rgba(0,200,255,0.06);border-radius:24px;padding:18px 20px 20px 20px;backdrop-filter:blur(7px);box-shadow:0 0 0 1px rgba(255,255,255,0.02) inset, 0 20px 60px rgba(0,0,0,0.6)}

        .status-bar .item{display:flex;align-items:center;gap:5px;color:#6a7e8e}

        .status-bar .dot.on{background:#00ff88;box-shadow:0 0 8px #00ff8844}

        @keyframes dotPulse{0%,100%{opacity:0.4;transform:scale(0.9)}50%{opacity:1;transform:scale(1.2)}}
